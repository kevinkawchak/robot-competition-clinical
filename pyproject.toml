[project]
name = "robot-competition-clinical"
version = "1.2.0"
description = "Clinical trial robot competition simulation with real Unitree H2 Plus humanoid robots (75 DOF + SHARPA hands, from fork_unitree_model/H2_Plus USD files) — 4-station PPO-driven GCP injection visit race with realistic human patients, naturally dissimilar station motion/scoring, infinite zoom, built on MuJoCo physics"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
