[project]
name = "robot-competition-clinical"
version = "1.0.0"
description = "Clinical trial robot competition simulation with Unitree G1 humanoid robots (unitreerobotics) — 4-station PPO-driven injection procedure race with realistic human patients (properly seated, facial features), close-zoom camera, Z-fight-free coats, and accurate needle-deltoid contact, built on MuJoCo physics"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
